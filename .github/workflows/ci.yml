name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Mocha/Chai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # SonarQube quality gate. Needs one repo secret before this can run:
  # SONAR_TOKEN (see docs/SONARQUBE_SETUP.md for how to get one, both for
  # SonarCloud and a self-hosted server). Runs after backend/frontend so
  # it never uploads coverage for a build that's already failing tests.
  #
  # Currently commented out because SONAR_TOKEN isn't provisioned in this
  # repo's secrets yet — uncomment once it is (Settings -> Secrets and
  # variables -> Actions -> New repository secret).
