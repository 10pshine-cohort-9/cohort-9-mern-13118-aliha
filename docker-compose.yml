services:
  postgres:
    image: postgres:16-alpine
    container_name: notes-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aliha
      POSTGRES_PASSWORD: itsaliha
      POSTGRES_DB: notes_app_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aliha -d notes_app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
