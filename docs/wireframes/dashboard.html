<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wireframe — Dashboard</title>
<link rel="stylesheet" href="wireframe.css" />
</head>
<body>
  <a class="back-link" href="index.html">&larr; All wireframes</a>
  <div class="frame">
    <h1 class="screen-title">Dashboard (List of Notes)</h1>

    <div class="btn-row" style="justify-content:flex-end; margin-bottom: 14px;">
      <div class="btn">+ New Note</div>
    </div>

    <div class="block">
      <span class="block-label">List of user-specific notes</span>
      <div class="note-item"><span>Grocery list</span><span>Jul 21</span></div>
      <div class="note-item"><span>Sprint 1 notes</span><span>Jul 20</span></div>
      <div class="note-item"><span>Book recommendations</span><span>Jul 18</span></div>
    </div>
  </div>

  <div class="ops">
    Operations
    <ul>
      <li>Fetch user-specific notes from the backend</li>
      <li>Display the list of notes</li>
      <li>Navigate to the Note Editor (new or existing note)</li>
    </ul>
  </div>
</body>
</html>
