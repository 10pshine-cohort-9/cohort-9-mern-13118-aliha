<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wireframe — Note Editor</title>
<link rel="stylesheet" href="wireframe.css" />
</head>
<body>
  <a class="back-link" href="index.html">&larr; All wireframes</a>
  <div class="frame">
    <h1 class="screen-title">Note Editor</h1>

    <div class="field" style="font-size:14px; padding:10px 12px;">Note title</div>

    <div class="block" style="min-height: 160px;">
      <span class="block-label">Rich text editor</span>
      <div style="color:#aaa; font-size:13px;">Bold, italic, lists, etc.</div>
    </div>

    <div class="btn-row">
      <div class="btn">Save</div>
      <div class="btn" style="background:#fff;">Cancel</div>
    </div>
  </div>

  <div class="ops">
    Operations
    <ul>
      <li>Create a new note or edit an existing one</li>
      <li>Save the note to the backend</li>
      <li>Return to Dashboard after saving or canceling</li>
    </ul>
  </div>
</body>
</html>
