<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wireframe — User Profile</title>
<link rel="stylesheet" href="wireframe.css" />
</head>
<body>
  <a class="back-link" href="index.html">&larr; All wireframes</a>
  <div class="frame">
    <h1 class="screen-title">User Profile <span style="font-weight:normal;">(optional)</span></h1>

    <div class="block">
      <span class="block-label">User details</span>
      <div style="color:#555; font-size:13px; line-height:1.8;">
        Name: Ada Lovelace<br />
        Email: ada@example.com
      </div>
    </div>

    <div class="btn" style="background:#fff;">Log Out</div>
  </div>

  <div class="ops">
    Operations
    <ul>
      <li>Display user information</li>
      <li>Log the user out</li>
    </ul>
  </div>
</body>
</html>
