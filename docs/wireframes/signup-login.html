<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wireframe — Sign Up / Log In</title>
<link rel="stylesheet" href="wireframe.css" />
</head>
<body>
  <a class="back-link" href="index.html">&larr; All wireframes</a>
  <div class="frame">
    <h1 class="screen-title">Sign Up / Log In</h1>

    <div class="block">
      <span class="block-label">Log-in form</span>
      <div class="field">Email</div>
      <div class="field">Password</div>
      <div class="btn">Log In</div>
    </div>

    <div class="block">
      <span class="block-label">Sign-up form</span>
      <div class="field">Name</div>
      <div class="field">Email</div>
      <div class="field">Password</div>
      <div class="btn">Sign Up</div>
    </div>
  </div>

  <div class="ops">
    Operations
    <ul>
      <li>User registration and authentication</li>
      <li>Redirect to the main application (Dashboard) on successful login</li>
    </ul>
  </div>
</body>
</html>
